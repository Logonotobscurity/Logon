name: LOG_ON Kernel CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  runner-smoke:
    name: runner-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner started
        run: |
          set -euxo pipefail
          echo "runner started"
      - name: Runtime versions
        run: |
          set -euxo pipefail
          node --version
          npm --version

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Environment
        run: |
          set -euxo pipefail
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --reporter=verbose

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logon
          POSTGRES_PASSWORD: logon
          POSTGRES_DB: logon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logon -d logon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOGON_DATABASE_URL: postgres://logon:logon@localhost:5432/logon
      LOGON_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Environment
        run: |
          set -euxo pipefail
          node --version
          npm --version
          echo "postgres host=localhost port=5432"
          echo "redis host=127.0.0.1 port=6379 db=0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests
        run: npm run test:integration -- --reporter=verbose

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build kernel package
        run: npm run build
      - name: Build control plane
        run: npm run build:control-plane

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [runner-smoke, unit, integration, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        env:
          RUNNER_SMOKE_RESULT: ${{ needs.runner-smoke.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euxo pipefail
          echo "runner-smoke=$RUNNER_SMOKE_RESULT"
          echo "unit=$UNIT_RESULT"
          echo "integration=$INTEGRATION_RESULT"
          echo "frontend=$FRONTEND_RESULT"

          test "$RUNNER_SMOKE_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          echo "CI gate passed"
